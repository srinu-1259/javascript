<html>
  
  <body>
    <h2>what can javascript do?</h2>
  <p>javascript can change HTML attribute values</p>
  <p>in this case javascript changes the values of src(source) attributes of an image</p>
  <button onclick="document.getElementById('myimage').src='light on.jpg'">On</button>
  <button onclick="document.getElementById('myimage').src='light off.jpg'">Off</button>
  <br><br>
  <img id="myimage" src="light off.jpg" style="width: 100px;">
  </body>
</html>
